name: runtime

# The runtime is the half of this project that can be tested cheaply.
#
# The compiler needs an unreleased LLVM (24.0git, for the new-style op builders),
# so no packaged MLIR can build it and CI for it needs either a cached LLVM build
# or a prebuilt container. The runtime needs neither: it is plain C99 with no
# MLIR and no LLVM, so it builds here in seconds.
#
# It is tested against a module checked in at runtime/test/fixtures/, which is
# also what pins the format -- a change that breaks the reader fails here rather
# than when someone tries to run an old artifact. Tests that need to *produce* a
# module are gated `REQUIRES: compiler` and report as unsupported.

